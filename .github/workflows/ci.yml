name: CI

# Every compile and test runs here, on GitHub's runners, never on a developer's machine.
# kache caches compiler outputs in GitHub's Actions cache; only master saves to it.
# The two sibling libraries (nsh-query, nsh-form) are fetched by tools/ci/fetch-siblings.sh.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  LINUX_PACKAGES: dbus dbus-user-session libgtk-4-dev libwebkitgtk-6.0-dev clang llvm

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the sibling libraries
        shell: bash
        run: tools/ci/fetch-siblings.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check
      # Android rejects package ids with hyphens; nsh.json and the TSX package both feed one.
      - name: Check app ids for Android
        run: |
          for manifest in nsh.json packages/remote-screen/nsh.json; do
            id="$(jq -r .id "$manifest")"
            case "$id" in
              *-*) echo "$manifest: id '$id' contains a hyphen, which Android rejects"; exit 1 ;;
            esac
            echo "$manifest: id $id"
          done

  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the sibling libraries
        shell: bash
        run: tools/ci/fetch-siblings.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.0.0
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: rust-${{ matrix.os }}
          cache-key-prefix: kache-rust-${{ matrix.os }}
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - name: Install NSH
        if: runner.os != 'Windows'
        env:
          NSH_VERSION: v0.4.0
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install NSH
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          NSH_VERSION: v0.4.0
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Clippy (the just check gate)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test (the just test gate)
        run: cargo test --no-fail-fast

  cross-check:
    name: check (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-ios }
          - { os: macos-latest, target: aarch64-apple-ios-sim }
          - { os: ubuntu-latest, target: aarch64-linux-android }
          - { os: ubuntu-latest, target: wasm32-unknown-unknown }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the sibling libraries
        shell: bash
        run: tools/ci/fetch-siblings.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
          targets: ${{ matrix.target }}
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.0.0
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: check-${{ matrix.target }}
          cache-key-prefix: kache-check-${{ matrix.target }}
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
      - name: Point cc at the NDK
        if: matrix.target == 'aarch64-linux-android'
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      # The binary's main is desktop-only (compile_error! elsewhere), so the library is what crosses.
      - run: cargo clippy --lib --target ${{ matrix.target }} -- -D warnings

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the sibling libraries
        shell: bash
        run: tools/ci/fetch-siblings.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.0.0
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: typescript
          cache-key-prefix: kache-typescript
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - name: Install NSH
        env:
          NSH_VERSION: v0.4.0
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Link the sibling TSX packages into the remote-screen package
        # Same layout as the local checkout: node_modules/<name> points at the sibling package.
        run: |
          parent="$(cd .. && pwd)"
          mkdir -p packages/remote-screen/node_modules
          ln -s "$parent/nsh-query/packages/nsh-query" packages/remote-screen/node_modules/nsh-query
          ln -s "$parent/nsh-form/packages/nsh-form" packages/remote-screen/node_modules/nsh-form
      - name: Root app, check and build without warnings, then test
        # vision/ is not in this headless gate: its tests drive screenshots that need a real
        # target (`nsh test vision/<file> --target macos`) and a model to review them. Headless
        # runs fail there by design, so only App.test.tsx and smoke/ run; each run also does cargo test.
        run: |
          nsh check
          nsh build 2>&1 | tee build.log
          ! grep -i warn build.log
          nsh test App.test.tsx
          nsh test smoke/pages.test.tsx
      - name: packages/remote-screen, check and build without warnings, then test
        working-directory: packages/remote-screen
        run: |
          nsh check
          nsh build 2>&1 | tee build.log
          ! grep -i warn build.log
          nsh test

  demo:
    name: demo (${{ matrix.name }})
    # Packaging does not depend on the test jobs, so demo builds keep being checked while a test
    # is red; publish still waits for every gate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Desktop builds come out for the runner's own processor, so each architecture gets its own runner.
          # NSH 0.4.0 ships prebuilt CLIs only for macOS arm64, Linux x86_64 and Windows x86_64;
          # the other three build NSH's CLI from its v0.4.0 source (nsh: source).
          - { os: macos-latest, target: macos, name: macos-arm64, nsh: release }
          - { os: macos-15-intel, target: macos, name: macos-x86_64, nsh: source }
          - { os: ubuntu-latest, target: linux, name: linux-x86_64, nsh: release }
          - { os: ubuntu-24.04-arm, target: linux, name: linux-arm64, nsh: source }
          - { os: windows-latest, target: windows, name: windows-x86_64, nsh: release }
          - { os: windows-11-arm, target: windows, name: windows-arm64, nsh: source }
          - { os: macos-latest, target: ios-simulator, name: ios-simulator, nsh: release }
          - { os: ubuntu-latest, target: android, name: android, nsh: release }
          - { os: ubuntu-latest, target: web, name: web, nsh: release }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the sibling libraries
        shell: bash
        run: tools/ci/fetch-siblings.sh
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target == 'android' && 'aarch64-linux-android' || matrix.target == 'web' && 'wasm32-unknown-unknown' || matrix.target == 'ios-simulator' && 'aarch64-apple-ios-sim' || '' }}
      - uses: kunobi-ninja/kache-action@ad7317540dcdd71c904f7a60a87b620a0c0e67ed # v1
        with:
          version: v2.0.0
          cache-dir: ${{ runner.temp }}/kache
          manifest-key: demo-${{ matrix.name }}
          cache-key-prefix: kache-demo-${{ matrix.name }}
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          pr-comment: false
      - name: Install the wasm-bindgen CLI that NSH's web runtime needs
        if: matrix.target == 'web'
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: wasm-bindgen@0.2.129
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_PACKAGES
      - name: Install NSH
        if: matrix.nsh != 'source' && runner.os != 'Windows'
        env:
          NSH_VERSION: v0.4.0
        run: |
          curl -fsSL https://nsh.dev/install.sh | sh
          echo "$HOME/.nsh/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install NSH
        if: matrix.nsh != 'source' && runner.os == 'Windows'
        shell: pwsh
        env:
          NSH_VERSION: v0.4.0
        run: |
          irm https://nsh.dev/install.ps1 | iex
          "$env:LOCALAPPDATA\nsh\bin" | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Build NSH's CLI from its v0.4.0 source
        if: matrix.nsh == 'source'
        shell: bash
        # The app lists a Rust crate, so `nsh package` builds the app's own runner with Cargo and needs no prebuilt runtime.
        run: cargo install --locked --git https://github.com/longbridge/nsh --tag v0.4.0 nsh-cli
      - name: Work around NSH 0.4.0's crates.io packaging of nsh-platform-ios
        if: matrix.target == 'ios-simulator'
        # The published crate includes a file it does not ship, so build NSH's crates from its v0.4.0 source.
        shell: bash
        run: |
          git clone --quiet --depth 1 --branch v0.4.0 https://github.com/longbridge/nsh "$RUNNER_TEMP/nsh-src"
          mkdir -p .cargo
          {
            echo "[patch.crates-io]"
            for crate in "$RUNNER_TEMP"/nsh-src/crates/nsh-*; do
              echo "$(basename "$crate") = { path = \"$crate\" }"
            done
          } > .cargo/config.toml
      - name: Package
        shell: bash
        run: |
          abi=""
          [ "${{ matrix.target }}" = android ] && abi="--abi arm64-v8a"
          nsh package --target ${{ matrix.target }} $abi --app-version 0.1.0 --build ${{ github.run_number }} --out "$RUNNER_TEMP/out"
      - name: Name the build
        shell: bash
        run: |
          mkdir -p dist
          cd "$RUNNER_TEMP/out"
          name="nsh-starter-demo-${{ matrix.name }}"
          case "${{ matrix.target }}" in
            android) cp ./*.apk "$GITHUB_WORKSPACE/dist/$name.apk" ;;
            linux) cp ./*.tar.gz "$GITHUB_WORKSPACE/dist/$name.tar.gz" ;;
            macos|ios-simulator) ditto -c -k --keepParent ./*.app "$GITHUB_WORKSPACE/dist/$name.zip" ;;
            windows) 7z a "$GITHUB_WORKSPACE/dist/$name.zip" ./* > /dev/null ;;
            web) tar -czf "$GITHUB_WORKSPACE/dist/$name.tar.gz" * ;;
          esac
          ls -la "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: demo-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the latest build
    needs: [format, rust, cross-check, typescript, demo]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    concurrency:
      group: publish-latest
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Replace the latest release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          test "$(ls dist | wc -l)" -eq 9 || { echo "expected nine demo builds in dist:"; ls -la dist; exit 1; }
          gh release delete latest --repo "$REPO" --cleanup-tag --yes || true
          gh release create latest dist/* --repo "$REPO" --target "$GITHUB_SHA" --latest \
            --title "Latest build" \
            --notes "Demo builds from master at $GITHUB_SHA, replaced on every push to master. Unsigned: macOS and Windows will warn before opening them, and the iOS build runs only in the simulator."
