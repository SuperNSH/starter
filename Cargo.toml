[package]
name = "nsh-starter"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
nsh-core = "0.4.0"
nsh-base = "0.4.0"
nsh-query = { path = "../nsh-query/crates/nsh-query" }
nsh-form = { path = "../nsh-form/crates/nsh-form" }
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-i18n = "4"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
nsh-platform-macos = { version = "0.4.0", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
nsh-platform-windows = { version = "0.4.0", default-features = false }

[dev-dependencies]
nsh-engine = "0.4.0"
nsh-testing = { version = "0.4.0", default-features = false }
